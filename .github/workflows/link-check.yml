name: Link Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md ./*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
